name: 가격 알림 감시

# ★ 트리거는 이 둘만 쓴다.
#   pull_request_target / issue_comment / workflow_run 은 남이 준 입력으로 코드가 돌면서
#   시크릿에 접근할 수 있는 트리거라, 공개 저장소에서 시크릿을 쓸 땐 절대 쓰지 않는다.
#   schedule + workflow_dispatch 조합엔 그 공격 경로가 없다.
on:
  schedule:
    # GitHub 예약 실행의 최소 간격은 5분이고, 실제로는 부하에 따라 밀리거나 통째로
    # 건너뛸 수 있다. 10분으로 두면 한 번 밀려도 다음 슬롯이 20분 안에 온다.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# 상태를 alerts-state 브랜치에 밀어넣어야 하므로 쓰기 권한.
# 저장소 기본값에 기대지 않고 여기서 명시한다.
permissions:
  contents: write

# 앞 실행이 아직 돌고 있으면 새로 시작하지 않는다 — 같은 상태를 두 실행이 동시에 쓰면
# 알림이 중복되거나 상태가 뒤엉킨다. 취소하지 않고 기다리게 두는 쪽(cancel-in-progress
# 없음)이 맞다: 취소하면 이미 보낸 카톡의 상태가 저장되지 않아 다음 실행이 또 보낸다.
concurrency:
  group: mobi-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # 제3자 액션은 쓰지 않는다 — 그 액션이 털리면 시크릿을 넘겨받은 채로 돌기 때문.
      # 공식 actions/* 만 사용한다.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 상태는 main 이 아니라 전용 브랜치에 둔다 ──
      # 10분마다 도는 작업이라 main 에 커밋하면 하루 144개가 쌓이고, 이 저장소의 Pages 는
      # 브랜치 배포라 그때마다 사이트가 재빌드된다. alerts-state 브랜치는 항상 커밋 1개로
      # 강제 덮어쓰기 하므로 main 이력은 깨끗하고 저장소도 안 커진다.
      - name: 지난 상태 불러오기
        run: |
          if git fetch --depth 1 origin alerts-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > alerts/state.json
            echo "지난 상태를 불러왔습니다."
          else
            echo '{}' > alerts/state.json
            echo "상태 브랜치가 아직 없습니다 — 이번이 첫 실행입니다."
          fi
          # 저장 단계에서 "정말 바뀌었는지" 비교할 사본 (안 바뀌었으면 푸시를 건너뛴다)
          cp alerts/state.json alerts/.state_prev

      - name: 감시 실행
        env:
          MOBI_API_KEY: ${{ secrets.MOBI_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          # 카카오가 미설정이면 이슈 댓글(=메일)로 알린다. 이 토큰은 워크플로가 자동으로
          # 갖고 있어서 사람이 등록할 시크릿이 늘지 않는다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGE_URL: https://scarzsearch-cyber.github.io/mobi-market/
        run: python alerts/watch.py

      # 감시가 실패했더라도 이미 보낸 알림의 상태는 반드시 남겨야 중복 전송이 안 난다.
      - name: 상태 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f alerts/state.json || { echo "상태 파일 없음 — 저장 생략"; exit 0; }
          # 시크릿 등록 전이거나 아무 변화도 없었으면 같은 내용을 10분마다 강제 푸시하게 된다.
          # 실제로 바뀐 게 있을 때만 쓴다.
          if [ -f alerts/.state_prev ] && cmp -s alerts/.state_prev alerts/state.json; then
            echo "상태 변화 없음 — 저장 생략"
            exit 0
          fi
          work=$(mktemp -d)
          cp alerts/state.json "$work/state.json"
          cd "$work"
          git init -q
          git checkout -q -b alerts-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "감시 상태 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            alerts-state
          echo "상태를 alerts-state 브랜치에 저장했습니다."

      # ── 서버가 배운 보정 계수만 main 에 발행한다 ──
      # state.json 과 달리 이 파일은 브라우저(index.html 의 pullAvgFromServer)가 직접 읽어야
      # 하고, 브라우저가 읽을 수 있는 곳은 Pages 가 서비스하는 main 뿐이다. 이게 없으면
      # 아무도 탭을 안 켜둔 사이에 지나간 품귀를 서버만 알게 되고, 화면과 카톡이 서로 다른
      # 천장을 말한다.
      # 위 "상태는 main 에 커밋하지 않는다" 원칙에서 이 파일만 예외로 두는 근거: 계수는
      # plateau 가 5% 이상 달라질 때만 갱신되므로 10분마다가 아니라 며칠에 한 번 수준으로
      # 드물게 바뀐다. 그래서 "실제로 내용이 바뀌었을 때만" 커밋한다 — 안 바뀌면 재빌드도 없다.
      - name: 학습 계수 발행
        if: always()
        run: |
          test -f alerts/learned.json || { echo "학습 계수 파일 없음 — 발행 생략"; exit 0; }
          # 처음엔 추적되지 않는 파일(??)이라 git diff 로는 안 잡힌다 — status 로 본다.
          if [ -z "$(git status --porcelain -- alerts/learned.json)" ]; then
            echo "학습 계수 변화 없음 — 발행 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts/learned.json
          git commit -q -m "chore(alerts): 학습 보정 계수 갱신"
          # 앱이 같은 시각에 settings.json 을 올리면 push 가 밀린다(서로 다른 파일이라 충돌은
          # 안 난다). 그때만 원격을 받아 다시 얹고 재시도한다.
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "학습 계수를 main 에 발행했습니다."
              exit 0
            fi
            echo "다른 커밋에 밀렸습니다 — 원격을 받아 다시 얹습니다 ($i/3)"
            git fetch -q origin main || break
            git rebase -q origin/main || { git rebase --abort || true; break; }
          done
          # 발행 실패가 감시 자체를 실패로 만들면 안 된다 — 계수는 다음 실행에서 다시 올라간다.
          echo "⚠ 학습 계수 발행 실패 — 다음 실행에서 재시도합니다."
